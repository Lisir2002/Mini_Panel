<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      Mini Panel 前端入口（M1：Vue 3 + Vite + Element Plus）。

      构建产物是单个 dist/index.html（见 vite.config.mjs 的两条约束），由
      webui/embed.go 的 //go:embed all:dist 打进二进制，因此：
        * 面板没有独立的静态目录，也没有运行时必须存在的路径；
        * 未登录时登录页需要的每一个字节都在这一个响应里，不会因为
          资源路径落在安全入口之外而被闸门伪装掉。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Panel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171b21'/%3E%3Cpath d='M8 23V9h3.4l4.6 8 4.6-8H24v14h-2.8v-8.6L17.4 21h-2.8l-3.8-6.6V23z' fill='%233b82f6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
