openapi: 3.0.3
info:
  title: Mini Panel API
  version: 0.1.0-m0
  description: |
    Mini Panel 的内部 REST 接口，M0 里程碑。

    约定：
      - 所有响应均为 application/json; charset=utf-8。
      - 除 /healthz 与安全入口页面本身，所有接口都要求会话 Cookie；
        未认证的请求一律得到"伪装响应"（默认 404），而不是 401。
      - 任何写操作（非 GET/HEAD/OPTIONS）必须回传 X-Mini-CSRF 请求头，
        其值等于 mp_csrf Cookie（double-submit）。
      - 携带口令的接口在没有 TLS 时返回 503 tls_required；仅当面板监听
        回环地址且客户端也是回环地址时才允许明文调试。

    本文件与 internal/api/server.go 的路由表由 TestOpenAPIContractMatchesRoutes
    强制对齐（`make check-contract`）：新增接口而未登记规格，测试即失败。
servers:
  - url: /
tags:
  - name: public
    description: 无需会话
  - name: auth
    description: 登录、初始化、登出
  - name: panel
    description: 面板自身的只读与设置接口
  - name: account
    description: 当前管理员的两步验证与口令
security:
  - sessionCookie: []
    csrfHeader: []
paths:
  /healthz:
    get:
      tags: [public]
      summary: 存活探针与产品事实
      security: []
      description: |
        安全入口之外也可访问：监控系统需要它。返回产品名、版本、运行时长，
        以及 requires_setup / entrance_enabled 两个初始化状态。
        telemetry 恒为 false，且代码中不存在任何外呼上报路径。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { type: string, example: Mini Panel }
                  version: { type: string }
                  commit: { type: string }
                  uptime_seconds: { type: integer, format: int64 }
                  telemetry: { type: boolean, example: false }
                  requires_setup: { type: boolean }
                  entrance_enabled: { type: boolean }
  /api/v1/setup:
    post:
      tags: [auth]
      summary: 创建第一个管理员（仅在账号表为空时可用）
      security: []
      description: |
        必须先访问过安全入口（携带 mp_entrance 标记 Cookie），否则按伪装响应处理。
        一旦存在任何账号即返回 409 already_initialized，因此它不是常驻的
        未认证建号接口。口令强度不达标返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201": { description: 已创建 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/Disguised" }
        "409": { description: 管理员账号已存在 }
        "503": { $ref: "#/components/responses/TLSRequired" }
  /api/v1/login:
    post:
      tags: [auth]
      summary: 登录并建立会话
      security: []
      description: |
        未知用户名与错误密码返回完全相同的 401 响应体，避免账号枚举。
        失败按 IP + 用户名计数，达到 panel.login_limit 后进入指数退避锁定，
        最长 1 小时；锁定期内即使口令正确也返回 429。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: 登录成功，同时下发 mp_session 与 mp_csrf
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  csrf: { type: string }
                  totp_enabled: { type: boolean }
                  must_change_pw:
                    type: boolean
                    description: 口令尚未经本人确认（CLI 设过，或已按 panel.password_expiry_days 过期）
                  password_expired:
                    type: boolean
                    description: must_change_pw 是因为过期触发的；区分"改口令"与"补一次确认"
                  password_changed:
                    type: integer
                    format: int64
                    description: 当前口令的设置时间（unix 秒），0 表示无记录
                  expires_at: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Disguised" }
        "429": { description: 失败次数过多，响应体内含剩余等待时长 }
        "503": { $ref: "#/components/responses/TLSRequired" }
  /api/v1/logout:
    post:
      tags: [auth]
      summary: 作废当前会话
      responses:
        "200": { description: 已登出 }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/session:
    get:
      tags: [panel]
      summary: 当前会话身份
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  csrf: { type: string }
                  platform: { type: string, example: linux }
                  must_change_pw: { type: boolean }
                  password_expired: { type: boolean }
        "403": { description: 当前 IP 不在 panel.ip_allowlist 中 }
        "404": { $ref: "#/components/responses/Disguised" }
      description: |
        /session 是三个"口令待确认"状态下仍然可达的路径之一（另外两个是
        /password 与 /logout）。must_change_pw 为真时其余已鉴权路径一律返回
        403 password_change_required——包括 /settings，所以救回自己的办法是
        改口令，或者在本机跑 minipanel passwd。把有效期做成"登录时判定一次"
        是为了不打断正在干活的运维；口令在会话中途到期不会踢人，只在下一次
        登录时要求更换。
  /api/v1/capabilities:
    get:
      tags: [panel]
      summary: 本机能力位图
      description: |
        前端渲染的唯一依据。契约 v2（docs/功能设计.md §4.1）：features 的每一项是
        {state, reason, fix_action, verify}，state 只有 available / degraded /
        unavailable / foreign 四种取值，非 available 的项 reason 必须非空；
        界面据此显示"禁用 + 理由"，绝不渲染点击无响应的按钮，也不隐藏做不到的模块。
        v1 的 unavailable 平行 map 已删除——它和 features 可以各说各话。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/system/info:
    get:
      tags: [panel]
      summary: 主机与面板运行信息
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/sites:
    get:
      tags: [site]
      summary: 面板创建的静态站点列表
      description: |
        M2 第三片：静态站点。只列出面板自己写出的配置——文件内带机器可读的
        minipanel-site 标记，且文件名与标记里的站点名一致。同一目录下手工写的
        vhost 不是面板的，不出现在列表里，删除端点也碰不到它。
        可选能力：site 不可用时本端点返回 403 capability，message 直接取
        /api/v1/capabilities 里 site 那一项的 reason（本机没有 nginx / 面板不是
        root / 检测到 Apache 而写 Provider 目前只有 nginx），不在这里另写一套说法。
        每行是 {name, domains, root, config_path, enabled, created_at, tls?,
        index?, php_version?, php_socket?, php_socket_state?}；enabled 在
        sites-enabled 布局里等价于软链接存在，conf.d 布局里恒为 true。index 只在
        操作者自定义了默认文档时出现，缺省表示面板内置列表（绑定 PHP 时为
        index.php index.html index.htm，否则 index.html index.htm）。tls 只在启用
        HTTPS 后出现，字段为
        {enabled, redirect, self_signed, acme, cert_path?, key_path?, not_after?,
        error?}；acme=true 的证书由面板自动续期，手工上传与自签证书不会以这种方式出现。
        php_version 非空表示站点已绑定到该 fpm 版本，php_socket 是平台从现场探测推导出的
        unix socket，php_socket_state 是这次读取时 socket 的真实状态（listening / idle /
        absent / not_socket / unknown），不是持久化的承诺。rewrite 是本地模板库里的规则 id
        （none / wordpress / laravel / thinkphp / spa）；none 或省略表示默认的
        try_files $uri $uri/ =404。proxy_target 非空表示站点把 location / 反向代理到该
        上游 URL，proxy_websocket 表示同时转发 Upgrade 头；两者只在启用代理后出现，
        且与 rewrite 模板互斥（同一个 location / 不能既代理又做伪静态）。
        redirect_target 非空表示站点把整站跳转到该 URL，redirect_code 是 301 或 302，
        redirect_keep_path 表示拼接 $request_uri 保留原路径；三者只在启用跳转后出现，
        且与 rewrite、proxy 三者互斥（都占用 location /）。
      responses:
        "200": { description: 返回 total 与 items }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
    post:
      tags: [site]
      summary: 创建一个站点（可选绑定 PHP、可选自定义默认文档）
      description: |
        请求体 {name, domains[], root?, index?, php_version?}。name 是 2-32 位小写字母/数字/
        连字符，domains 是 1-20 个 example.com 或 *.example.com 形状的主机名，root
        省略时取站点根目录下的同名子目录，且必须位于站点根目录之内（不给站点表单变成
        任意路径读取口的机会）。index 省略或为空表示内置默认文档列表；非空时按给定顺序
        写入 vhost，最多 10 项、每项必须是文件名（不能含路径），静态站点拒绝 .php 项，
        否则 nginx 会把 PHP 源码当文本返回。php_version 省略或为空表示纯静态站点；非空时必须是
        本机探测到且带 fpm 后端的版本，平台把版本解析成 socket 后才写配置，版本不存在
        或只有 cli/cgi 时返回 422 php_unavailable，且不会创建站点。选择版本还要求
        php_version_switch 为 available；静态站点不受该能力影响。
        rewrite 省略或为 none 表示默认静态查找；wordpress / laravel / thinkphp 需要同时
        绑定 PHP，否则返回 400 invalid_site（避免 nginx 把 index.php 当文本返回）；spa
        可用于静态站点，回退到 /index.html。规则内容来自二进制内置模板，不接受调用方
        提交配置片段。
        写入协议是"先测试后生效"：写配置 → nginx -t → 只有通过才 reload。任何一步
        失败都会恢复改动前的文件，因此响应为 422 nginx_rejected 时 nginx 里看到的
        仍然是上一份配置。成功的响应是 201 + 站点行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, domains]
              properties:
                name: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
                domains:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                root: { type: string, description: 可省略；必须位于站点根目录之下 }
                index:
                  type: array
                  maxItems: 10
                  items: { type: string }
                  description: 可省略；默认文档文件名列表，按顺序写入 vhost
                rewrite: { type: string, description: 可省略；内置模板 id（none / wordpress / laravel / thinkphp / spa） }
                php_version: { type: string, description: 可省略；必须是现场探测到带 fpm 的版本，如 8.3 }
      responses:
        "201": { description: 已创建并 reload }
        "400": { description: 站点参数不合法（invalid_site） }
        "409": { description: 同名站点已存在（site_exists） }
        "422": { description: nginx 拒绝（nginx_rejected）或 PHP 版本不可绑定（php_unavailable），均已回滚 }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/sites/rewrite-presets:
    get:
      tags: [site]
      summary: 列出内置伪静态模板
      description: |
        M2 第八片：返回本二进制内的固定模板集，每一项为
        {id, label, description, requires_php}。列表不联网、不从磁盘读取，也不接受上传；
        这是 §8.1 对"在线规则库"的拒绝在接口上的落点。requires_php=true 的模板只能用于
        已绑定 PHP 的站点；静态站点选择它会返回 400 invalid_site，而不是写出一份把
        index.php 当文本返回的配置。
        站点写入不可用时返回 403 capability，message 取 /api/v1/capabilities 的 site 理由。
      responses:
        "200": { description: 返回 items }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/sites/{name}:
    put:
      tags: [site]
      summary: 编辑站点基础设置（域名 / 根目录 / 默认文档）
      description: |
        M2 第七片：站点设置编辑。请求体 {domains[], root?, index?} 是全量替换：
        domains 为新的 1-20 个域名，root 省略或为空时保留当前根目录，index 省略或为空
        时恢复面板内置默认文档列表。站点名与 PHP 绑定不变。
        域名变更且站点已启用 HTTPS 时，面板会用磁盘上的现有证书重新校验新域名集合；
        证书不覆盖新名字就返回 422 invalid_tls，且不写入任何文件——不会出现"证书是
        old.example.com 的、vhost 却声明 new.example.com"的错配。需要先关闭 HTTPS，
        编辑域名后重新签发或上传。
        新的根目录不存在时会以 0755 创建；若随后的 nginx -t 或 reload 失败，配置恢复
        原样，新建的空目录也会删除。成功响应的站点行含 index（自定义时）与当前 PHP/证书状态。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string }
                root: { type: string, description: 省略或为空表示保留当前根目录 }
                index:
                  type: array
                  maxItems: 10
                  items: { type: string }
                  description: 省略或为空表示恢复内置默认文档列表
      responses:
        "200": { description: 已更新并 reload，返回更新后的站点行 }
        "400": { description: 参数不合法（invalid_site） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点（not_found） }
        "422": { description: 证书不覆盖新域名（invalid_tls）或 nginx 拒绝（nginx_rejected），均已回滚 }
    delete:
      tags: [site]
      summary: 删除一个面板创建的站点
      description: |
        只删除面板自己写的配置与 sites-enabled 软链接；站点根目录**故意保留**。
        删除 vhost 是配置动作，把它变成对 /www/wwwroot/<name> 的递归删除，等于
        在数据丢失按钮旁边放一个容易打错的名字。
        与创建走同一套先测试后生效：删除后 nginx -t 不通过或 reload 被拒，文件与
        软链接会被原样恢复，响应 422 nginx_rejected。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      responses:
        "200": { description: 已删除并 reload }
        "400": { description: 站点名格式不符 }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: nginx 拒绝，已恢复 }
        "403": { $ref: "#/components/responses/CSRF" }
  /api/v1/sites/{name}/php:
    put:
      tags: [site]
      summary: 切换站点绑定的 PHP 版本（空字符串切回静态）
      description: |
        M2 第六片：站点级 PHP 版本绑定。请求体 {php_version}：非空值必须是本机现场探测到
        且带 fpm 后端的版本（php_fpm_versions），平台把版本解析成该版本的 unix socket，
        再通过"写配置 → nginx -t → reload"改写 vhost 的 .php location；失败时恢复上一份
        配置，原绑定继续服务。php_version 为空表示清空绑定，站点回到纯静态。
        选择版本要求 php_version_switch 为 available；清空绑定不受该能力限制，否则删除
        php-fpm 之后就再也没有办法把站点解绑。响应是更新后的站点行，含 php_version /
        php_socket / php_socket_state；state 不是 listening 时站点会 502，需要先启动
        对应版本的 php-fpm。若站点正在使用 wordpress / laravel / thinkphp 伪静态模板，
        清空 PHP 会被拒绝（400 invalid_site），因为模板的回退目标是 index.php；先切回
        none 或 spa 再解绑。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [php_version]
              properties:
                php_version: { type: string, description: 空字符串表示静态；否则为已安装的 fpm 版本 }
      responses:
        "200": { description: 已生效，返回更新后的站点行 }
        "400": { description: 版本格式不合法（invalid_site） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: 版本不可绑定（php_unavailable）或 nginx 拒绝（nginx_rejected），已回滚 }
  /api/v1/sites/{name}/rewrite:
    put:
      tags: [site]
      summary: 设置站点的伪静态模板（none 关闭）
      description: |
        M2 第八片：请求体 {preset}，preset 必须是 GET /api/v1/sites/rewrite-presets
        返回的 id 之一（none / wordpress / laravel / thinkphp / spa）；none 表示恢复默认的
        try_files $uri $uri/ =404。服务端只把白名单 id 映射成固定 nginx 片段，不接受调用方
        提交 try_files 或任何配置文本。
        wordpress / laravel / thinkphp 需要站点当前已绑定 PHP；静态站点请求这些模板返回
        400 invalid_site。反方向同样受保护：已使用 PHP 模板的站点在清空 PHP 绑定时会被
        拒绝（PUT .../php），必须先切回 none 或 spa，避免 index.php 被当作文本返回。
        写入仍走"写配置 → nginx -t → 通过才 reload"；失败恢复上一份配置，响应 422
        nginx_rejected。成功响应是更新后的站点行，含 rewrite 字段。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset: { type: string, enum: [none, wordpress, laravel, thinkphp, spa] }
      responses:
        "200": { description: 已生效，返回更新后的站点行 }
        "400": { description: 模板未知或站点未绑定 PHP（invalid_site） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: nginx 拒绝，已回滚（nginx_rejected） }
  /api/v1/sites/{name}/proxy:
    put:
      tags: [site]
      summary: 设置或清除站点的反向代理（固定上游 URL，可选 WebSocket）
      description: |
        M2 第九片：请求体 {target, websocket}。target 是一个 http:// 或 https:// 上游
        URL（可带端口与路径前缀），服务端用 url.Parse 解析后按 scheme/host/port/path
        重新规范化，只接受主机名、IP 字面量与合法端口；拒绝 userinfo、查询串、片段、
        控制字符以及 ; { } 引号 反斜杠 $ 反引号 等 nginx 元字符。代理指令块是固定
        模板：proxy_pass 加上 Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto
        四个头；websocket=true 时再追加 Upgrade / Connection 两行，用于 WebSocket
        升级。调用方不能提交任何 nginx 配置文本。
        target 为空字符串表示清除代理，站点回到默认的 try_files $uri $uri/ =404；
        这是始终允许的救援路径。websocket=true 搭配空 target 返回 400 invalid_site，
        避免表单误操作把站点改成"只有升级头"的怪状态。
        反向代理与伪静态模板互斥：两者都占用 location /。站点正在使用非 none 模板时
        设置代理返回 400 invalid_site；站点已启用代理时设置非 none 模板同样被拒绝。
        先把一边切回 none 或清空，再启用另一边。PHP 绑定不受影响：.php location 是
        正则匹配，优先于代理的 location /，可以同时存在。
        写入仍走"写配置 → nginx -t → 通过才 reload"；失败恢复上一份配置，响应 422
        nginx_rejected。成功响应是更新后的站点行，含 proxy_target / proxy_websocket。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: 上游 URL；空字符串表示清除代理 }
                websocket: { type: boolean, description: 是否转发 WebSocket 升级头 }
      responses:
        "200": { description: 已生效，返回更新后的站点行 }
        "400": { description: 上游 URL 不合法或与伪静态冲突（invalid_site） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: nginx 拒绝，已回滚（nginx_rejected） }
  /api/v1/sites/{name}/redirect:
    put:
      tags: [site]
      summary: 设置或清除站点的整站跳转（固定 URL，301/302，可选保留路径）
      description: |
        M2 第十片：请求体 {target, code, keep_path}。target 是一个 http:// 或 https://
        绝对 URL，校验规则与反向代理完全一致（url.Parse 后按 scheme/host/port/path
        规范化，拒绝 userinfo、查询串、片段、控制字符与 nginx 元字符）。生成的配置
        只有一行固定模板 return <code> <target>[ $request_uri];，调用方不能提交任何
        nginx 配置文本。
        code 在 target 非空时必填，只接受 301 或 302；0、307、308 等其它值返回 400
        invalid_site；keep_path=true 表示把请求的
        $request_uri 拼到 target 之后，用于"换域名但保留路径"的场景，此时 target
        尾部斜杠会被去掉，避免出现双斜杠。
        target 为空字符串表示清除跳转，站点回到默认的 try_files $uri $uri/ =404；
        这是始终允许的救援路径，此时 code 与 keep_path 一并忽略。
        整站跳转与伪静态模板、反向代理三者互斥：它们都占用 location /。站点正在
        使用非 none 模板或已启用代理时设置跳转返回 400 invalid_site；反过来启用
        伪静态或代理时也会被跳转拒绝。先把一边切回 none / 清空，再启用另一边。
        写入仍走"写配置 → nginx -t → 通过才 reload"；失败恢复上一份配置，响应 422
        nginx_rejected。成功响应是更新后的站点行，含 redirect_target / redirect_code /
        redirect_keep_path。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: 绝对 URL；空字符串表示清除跳转 }
                code: { type: integer, description: "非空 target 时必填：301 或 302；清除时忽略" }
                keep_path: { type: boolean, description: 是否拼接 $request_uri 保留原路径 }
      responses:
        "200": { description: 已生效，返回更新后的站点行 }
        "400": { description: 跳转目标或状态码不合法、与伪静态/代理冲突（invalid_site） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: nginx 拒绝，已回滚（nginx_rejected） }
  /api/v1/sites/{name}/tls:
    post:
      tags: [site]
      summary: 为站点启用 HTTPS（自签或上传证书）
      description: |
        M2 第四片：站点证书。请求体 {mode, cert_pem?, key_pem?, redirect?}：
        mode=selfsigned 由面板生成 ECDSA P-256 自签证书，SAN 覆盖该站点的全部
        domains，有效期一年；mode=upload 要求同时给出 cert_pem 与 key_pem（证书链
        与私钥），面板校验两者配对、当前时间在有效期内、证书覆盖站点域名（通配符
        只按精确 SAN 匹配）。
        证书写入 /etc/minipanel/certs/<name>.crt（0644）与 .key（0600），随后按
        "先测试后生效"写 vhost：nginx -t 通过才 reload；任一步失败都会恢复改动前的
        配置、证书与私钥，响应 422 nginx_rejected 时 nginx 仍在服务上一份配置。
        redirect=true 时同时写 80→443 的 301 跳转，否则保留 80 明文监听。
        证书来源有三条：自签、上传、以及单独的 POST .../acme 自动签发；本端点不接受
        ACME 模式，因为它可能等待数分钟，与快速本地写入的失败语义不同。ssl 为
        unavailable 时本端点返回 403 capability，message 直接取位图里的 reason。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [selfsigned, upload] }
                cert_pem: { type: string, description: upload 模式必填 }
                key_pem: { type: string, description: upload 模式必填，与 cert_pem 配对 }
                redirect: { type: boolean, description: 是否把 HTTP 301 到 HTTPS }
      responses:
        "200": { description: 已生效，返回含 tls 字段的站点行 }
        "400": { description: 证书不合法或请求缺项（invalid_tls / invalid_site） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: nginx -t 或 reload 拒绝，已回滚（nginx_rejected） }
    delete:
      tags: [site]
      summary: 关闭站点 HTTPS
      description: |
        回到纯 HTTP：先写回不含 ssl 的 vhost，nginx -t 通过且 reload 成功后才删除
        面板管理的证书与私钥。失败时 vhost、证书、私钥一并恢复，响应 422。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      responses:
        "200": { description: 已关闭，返回不含 tls 的站点行 }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: nginx 拒绝，已回滚 }
  /api/v1/sites/{name}/acme:
    post:
      tags: [site]
      summary: 通过 ACME HTTP-01 自动签发证书
      description: |
        M2 第五片：ACME 自动签发与续期。请求体 {redirect?}。面板为站点全部域名创建
        RFC 8555 订单，把 CA 给出的 HTTP-01 token 写入站点根目录的
        .well-known/acme-challenge/，等待授权通过后提交 CSR、下载证书链与私钥，最后按
        与上传证书相同的校验与"先测试后生效"流程安装。
        强制 HTTPS 的站点，其 80 端口配置会保留一个仅允许
        /.well-known/acme-challenge/ 的 location；没有这个例外，首签成功后当天有效的
        证书在续期时就再也无法通过 HTTP-01。续期由面板后台每 12 小时检查一次，到期前
        30 天自动重签；手工上传与自签证书不会被自动替换。
        通配符域名需要 DNS-01，本版本拒绝并返回 422 acme_unsupported，请改用上传证书。
        CA 目录默认 Let's Encrypt；MINI_PANEL_ACME_DIRECTORY 可指向私有目录，
        MINI_PANEL_ACME_CA_FILE 可附加信任一个 CA 证书（测试或私有 CA）。
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect: { type: boolean, description: 是否把 HTTP 301 到 HTTPS }
      responses:
        "200": { description: 签发并生效，返回含 tls.acme=true 的站点行 }
        "400": { description: 请求体不是合法 JSON（bad_request） }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { description: 面板没有管理这个站点 }
        "422": { description: 通配符/挑战或 CA 失败（acme_unsupported / acme_failed），或 nginx 拒绝且已回滚（nginx_rejected） }
        "500": { description: 账户密钥或证书目录等本地故障（site_tls） }
  /api/v1/lockout-risks:
    get:
      tags: [panel]
      summary: 自救对称表（CLI 对照，只读）
      description: |
        docs/功能设计.md §3.10 的「CLI 对照」页与 §6.3 的自查表是同一份数据：由
        internal/lockout.Risks() 一次算出，`minipanel doctor` 取其中 armed=true 的
        行作为风险清单，本端点返回全表（含未武装的行），因为这张表的价值在于
        "出事之前就看到过"。两边不可能各说一套是这条设计的唯一理由。
        每行 {name, state, armed, undo}：state 是当前状态的人话描述（读不到数据库时
        如实写"读不出来"，不会假装未启用），armed 表示这个开关此刻是否真的能把人
        关在外面，undo 是在服务器本机执行的命令文本。
        本端点不执行任何命令，面板也没有执行命令的端点（§1.6：可传任意参数的执行器
        是提权入口，不是功能）。armed 的行包括入口路径、IP 白名单、两步验证、口令
        有效期与待确认口令；不含"当前是否正处于失败锁定中"——那个计数器只在面板进程
        内存里，从第二个进程读不到，所以表里说的是规则而不是状态。
        入口路径的值本身不在响应里出现：它和会话令牌一样是 secret，只说"已启用"。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        state: { type: string }
                        armed: { type: boolean }
                        undo: { type: string }
                  armed: { type: integer }
                  total: { type: integer }
                  executable:
                    type: boolean
                    description: 恒为 false；本面板没有"执行这些命令"的端点
        "403": { $ref: "#/components/responses/PasswordChange" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/settings:
    get:
      tags: [panel]
      summary: 设置项列表
      description: |
        每一项带 source：db 表示运行态可写值（存在 SQLite），panel.json 表示这是
        进程当前实际使用的引导值。panel.port / panel.entrance / panel.ssl /
        panel.session_timeout / panel.login_limit / panel.unauth_status 一律以运行
        中的配置为准回显，绝不回显数据库里的镜像值——数据库种子行只是初始化占位，
        把它当成真值会让设置页显示一个并没有在监听的端口。
        panel.entrance 只回显"已启用/已关闭"，不回显入口路径本身：入口是伪装手段，
        而设置页是会被截图的地方；需要看它请用 minipanel doctor。
        这些引导值不可通过 API 写入，修改需要编辑 panel.json 并重启，这是有意的设计。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        value: { type: string }
                        updated_at: { type: integer, format: int64, description: Unix 秒 }
                        editable: { type: boolean }
                        source: { type: string, enum: [db, panel.json] }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/settings/{key}:
    put:
      tags: [panel]
      summary: 写入一个可修改的设置项
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - panel.ip_allowlist
              - panel.password_expiry_days
              - panel.trust_proxy
            # panel.basic_auth used to be here. It had no enforcement point, and
            # a second authentication channel is not something this panel grows;
            # identity stays session + TOTP + IP allowlist + CSRF + lockout. The
            # key is now refused like any unknown one (400 immutable), and the
            # store v2 migration deletes rows an older binary wrote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        "200": { description: 已写入 }
        "400":
          description: 值不合法（非法 IP/CIDR、非布尔、越界）或该键不可通过 API 修改
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/audit:
    get:
      tags: [panel]
      summary: 审计日志分页读取（倒序）
      description: |
        只追加：整个接口面没有任何删除、清空审计的端点，包内也不存在相应方法。
        params_mask 中的口令类字段已掩码，params_hash 是原始值的 SHA-256，
        用于取证比对而不保存凭据本身。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/sessions:
    get:
      tags: [account]
      summary: 当前账号的会话列表
      description: |
        每行给 ip / user_agent / created_at / expires_at / revoked / expired /
        current。id 字段是 sessions.ref（8 随机字节的十六进制），**不是**会话令牌：
        mp_session 的值在任何响应、审计条目和日志行里都不出现，因为它拿着就能登录。
        列表按"还活着的在前、时间倒序"排，已撤销的行仍然返回——运维要的是
        "哪个是家里的笔记本"，而不是一个每次都在缩短的表格。
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/PasswordChange" }
        "404": { $ref: "#/components/responses/Disguised" }
    delete:
      tags: [account]
      summary: 撤销当前账号除本次登录以外的全部会话
      description: |
        返回 {ok, revoked, kept_current}。自己的会话故意保留：这条操作的语义是
        "把别的浏览器踢掉"，做完之后人不该被自己的按钮赶出去——结束当前会话的
        正确接口是 POST /api/v1/logout。
      responses:
        "200": { description: 已撤销 revoked 个，当前会话仍在用 }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/sessions/{id}:
    delete:
      tags: [account]
      summary: 撤销一个会话
      description: |
        {id} 是 sessions.ref，只用于取标识：先用 ^[0-9a-f]{16}$ 校验，再作为绑定
        参数进入一条同时按 user_id 过滤的 UPDATE（docs/功能设计.md §4.4 是这条
        纪律的原文）。不存在、已撤销、属于别人——三种情况都回同一个 404，接口不
        成为一个"哪些会话曾经存在"的探测器。
        撤销的是当前正在用的那一条时，响应带 current=true / need_relogin=true，
        并且服务端立刻清掉会话 Cookie：数据库已经不再认这个令牌了，让浏览器继续
        拿着它只会在下一个请求里多挨一次 404。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{16}$"
      responses:
        "200": { description: 已撤销 }
        "400": { description: 格式不符（不是 16 位十六进制） }
        "404": { description: 没有可撤销的会话 }
        "403": { $ref: "#/components/responses/CSRF" }
  /api/v1/2fa/setup:
    post:
      tags: [account]
      summary: 生成 TOTP 密钥与 otpauth URI（尚未生效）
      responses:
        "200": { description: 返回 secret / url / 提示文本 }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/2fa/enable:
    post:
      tags: [account]
      summary: 用一个有效口令确认启用两步验证
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: 已启用 }
        "400": { description: 口令校验失败或未先 setup }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
  /api/v1/password:
    post:
      tags: [account]
      summary: 修改当前管理员口令
      description: 校验旧口令与新口令强度；成功后作废该用户除当前会话外的所有会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        "200": { description: 已更新 }
        "400": { description: 旧口令错误或新口令强度不足 }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/Disguised" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mp_session
      description: HttpOnly + SameSite=Strict，过期即失效；登出与改密会作废会话。
    csrfHeader:
      type: apiKey
      in: header
      name: X-Mini-CSRF
      description: double-submit，值等于 mp_csrf Cookie。
  responses:
    Disguised:
      description: |
        伪装响应：入口外的路径、无会话或已失效会话都以"资源不存在"的形式回答，
        状态码由 panel.unauth_status 决定（400/401/403/404/444）。
        伪装只是掩护，真正的访问控制是监听地址 + 认证 + IP 白名单。
    TLSRequired:
      description: 面板未启用 TLS 且不是回环调试，拒绝接收凭据。
    PasswordChange:
      description: |
        403 password_change_required — 该账号的口令尚未由本人确认（CLI 设的，或已超过
        panel.password_expiry_days）。面板此时只放行 /session、/password、/logout 三条
        路径，所以其它页面的 403 不是故障，是策略；前端见此响应必须把用户带到改密。
    BadRequest:
      description: 请求体或参数不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 用户名或密码错误（对未知用户与错误密码给出完全相同的响应）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CSRF:
      description: 缺少或错误的 X-Mini-CSRF
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, format: password, minLength: 10 }
        code: { type: string, description: 启用两步验证时必填的 6 位动态口令 }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
              description: 稳定的机器可读标识，前端据此分支，不依赖中文文案
            message: { type: string }
    Capabilities:
      type: object
      properties:
        os: { type: string, example: linux }
        os_family: { type: string, example: debian }
        os_version: { type: string, example: Ubuntu 22.04.5 LTS }
        arch: { type: string, example: amd64 }
        is_privileged: { type: boolean }
        hostname: { type: string }
        web_servers:
          type: array
          items: { type: string, enum: [nginx, apache, caddy] }
        php_modes:
          type: array
          items: { type: string, enum: [fpm, cgi, module, not_found] }
        php_versions: { type: array, items: { type: string } }
        php_fpm_versions:
          type: array
          items: { type: string }
          description: 现场探测到的、带 fpm 后端的 PHP 版本；站点 PHP 选择器的唯一来源
        php_ext_install:
          type: array
          items: { type: string, enum: [package, source, prebuilt_dll] }
        reload_mode: { type: string, enum: [sighup, restart_only, none] }
        firewall: { type: string, enum: [ufw, firewalld, nftables, windows_filter_platform, none] }
        schedulers:
          type: array
          items: { type: string, enum: [panel, crontab, taskschd] }
        supports_sub_second_cron: { type: boolean }
        service_manager: { type: string, example: systemd }
        package_manager: { type: string, example: apt }
        permissions: { type: string, example: posix }
        remote_access:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, example: ssh }
              enabled: { type: boolean }
              port: { type: integer }
        database_engines: { type: array, items: { type: string } }
        features:
          type: object
          description: |
            能力契约的唯一载体：每个 key 一个对象。key 的集合由代码声明
            （internal/platform/capabilities.go 的常量表 + detect.go 的拒绝表），
            测试同时钉住两个方向——bitmap 里不许出现未声明的 key，已声明的 key
            也不许缺席，缺席即"藏起来"，是 §4.1 禁止的第四种表现。
          additionalProperties:
            type: object
            required: [state, reason]
            properties:
              state:
                type: string
                enum: [available, degraded, unavailable, foreign]
              reason:
                type: string
                description: |
                  state != available 时非空，且必须是运维读得懂的一句话（含里程碑
                  编号或缺失的前置）。state == available 时为空字符串。
              fix_action:
                type: string
                description: |
                  可执行的一步，只允许 §4.2 的三类：面板自己有权限的动作、一条可直接
                  复制的命令、或指向 verify 的复查。空字符串表示没有；不允许包名、
                  任意 URL 或任意命令。
              verify:
                type: string
                description: 运维自己确认的路径（只读），空字符串表示没有。
